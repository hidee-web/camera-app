<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>カメラアプリ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-title" content="カメラ">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #fff; font-family: sans-serif; }
    body { display: flex; flex-direction: column; }

    /* カメラ映像 */
    #viewer { position: relative; flex: 1; overflow: hidden; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    #message {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center; line-height: 1.6;
    }

    /* 撮った写真の一覧 */
    #photos {
      display: flex; gap: 6px; padding: 8px; overflow-x: auto; min-height: 76px; background: #111;
    }
    #photos img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    #empty { color: #888; font-size: 13px; align-self: center; padding-left: 4px; }

    /* 操作ボタン */
    #controls {
      display: flex; align-items: center; justify-content: space-around;
      padding: 16px 24px calc(16px + env(safe-area-inset-bottom)); background: #000;
    }
    #shutter {
      width: 72px; height: 72px; border-radius: 50%;
      border: 5px solid #fff; background: #fff; background-clip: content-box; padding: 3px;
    }
    #shutter:active { transform: scale(0.92); }
    #switch {
      width: 48px; height: 48px; border-radius: 50%; border: none;
      background: #333; color: #fff; font-size: 22px;
    }
    .spacer { width: 48px; }

    /* シャッター時のフラッシュ演出 */
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.15s; }

    /* 写真の拡大表示 */
    #detail {
      position: fixed; inset: 0; background: #000; display: none; flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    #detail.open { display: flex; }
    #detail img { flex: 1; width: 100%; min-height: 0; object-fit: contain; }
    #detail .bar { display: flex; justify-content: space-around; padding: 16px; }
    #detail button {
      padding: 10px 18px; border-radius: 20px; border: none; font-size: 15px;
      background: #333; color: #fff;
    }
    #detail #delete { background: #b91c1c; }
  </style>
</head>
<body>
  <div id="viewer">
    <!-- playsinline がないと iPhone で全画面再生になってしまう -->
    <video id="video" autoplay playsinline muted></video>
    <div id="message">カメラを起動しています…</div>
  </div>

  <div id="photos"><span id="empty">撮った写真がここに並びます</span></div>

  <div id="controls">
    <div class="spacer"></div>
    <button id="shutter" aria-label="撮影"></button>
    <button id="switch" aria-label="カメラ切り替え">🔄</button>
  </div>

  <!-- 拡大表示の画面 -->
  <div id="detail">
    <img id="detailImg" alt="">
    <div class="bar">
      <button id="close">閉じる</button>
      <button id="share">共有・保存</button>
      <button id="delete">削除</button>
    </div>
  </div>

  <div id="flash"></div>
  <canvas id="canvas" hidden></canvas>

  <script>
    const video = document.getElementById("video");
    const message = document.getElementById("message");
    const canvas = document.getElementById("canvas");
    const photos = document.getElementById("photos");
    const empty = document.getElementById("empty");
    const flash = document.getElementById("flash");
    const detail = document.getElementById("detail");
    const detailImg = document.getElementById("detailImg");

    let stream = null;
    let facingMode = "environment"; // environment = 背面カメラ, user = 前面カメラ
    let currentPhoto = null;        // 拡大表示中の写真

    /* ========== IndexedDB（iPhoneの中のデータベース） ========== */

    // データベースを開く（なければ作る）
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("camera-app", 1);
        req.onupgradeneeded = () => {
          // "photos" という保存場所を作る。id は自動で 1, 2, 3… と振られる
          req.result.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // 写真を1枚保存する
    async function savePhoto(blob) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("photos", "readwrite");
        const req = tx.objectStore("photos").add({ blob: blob, createdAt: Date.now() });
        req.onsuccess = () => resolve(req.result); // 振られた id が返ってくる
        tx.onerror = () => reject(tx.error);
      });
    }

    // 保存されている写真を全部読み込む
    async function loadPhotos() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction("photos").objectStore("photos").getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // 写真を1枚削除する
    async function deletePhoto(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("photos", "readwrite");
        tx.objectStore("photos").delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    /* ========== 画面表示 ========== */

    // 一覧の先頭にサムネイルを1枚追加する
    function addThumbnail(photo) {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(photo.blob);
      img.addEventListener("click", () => openDetail(photo, img));
      photos.prepend(img);
      empty.style.display = "none";
    }

    // 拡大表示を開く
    function openDetail(photo, thumb) {
      currentPhoto = { ...photo, thumb: thumb };
      detailImg.src = thumb.src;
      detail.classList.add("open");
    }

    function closeDetail() {
      detail.classList.remove("open");
      currentPhoto = null;
      resumeCamera();
    }

    // 止まってしまったカメラを動かし直す
    function resumeCamera() {
      const track = stream && stream.getVideoTracks()[0];
      if (!track || track.readyState === "ended" || track.muted) {
        // カメラが切れていたら起動し直す
        startCamera();
      } else {
        // 映像が一時停止しているだけなら再生し直す
        video.play().catch(() => startCamera());
      }
    }

    // 他のアプリから戻ってきたときも動かし直す
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") resumeCamera();
    });

    /* ========== カメラ ========== */

    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode },
          audio: false,
        });
        video.srcObject = stream;
        video.style.transform = facingMode === "user" ? "scaleX(-1)" : "none";
        message.style.display = "none";
      } catch (err) {
        message.style.display = "flex";
        message.textContent =
          "カメラを起動できませんでした。設定でカメラの使用を許可してください。（" + err.name + "）";
      }
    }

    function takePhoto() {
      if (!stream) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      if (facingMode === "user") {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, 0, 0);

      // フラッシュ演出
      flash.style.opacity = "0.8";
      setTimeout(() => (flash.style.opacity = "0"), 100);

      // 画像データ（Blob）にして保存 → 一覧に追加
      canvas.toBlob(async (blob) => {
        try {
          const id = await savePhoto(blob);
          addThumbnail({ id: id, blob: blob });
        } catch (err) {
          alert("保存に失敗しました：" + err.message);
        }
      }, "image/jpeg", 0.9);
    }

    function switchCamera() {
      facingMode = facingMode === "environment" ? "user" : "environment";
      startCamera();
    }

    /* ========== ボタンの設定 ========== */

    document.getElementById("shutter").addEventListener("click", takePhoto);
    document.getElementById("switch").addEventListener("click", switchCamera);
    document.getElementById("close").addEventListener("click", closeDetail);

    // 共有・保存（iPhoneの共有シートから「画像を保存」で写真アプリに保存できる）
    document.getElementById("share").addEventListener("click", async () => {
      if (!currentPhoto) return;
      const file = new File([currentPhoto.blob], "photo-" + currentPhoto.id + ".jpg", { type: "image/jpeg" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file] });
        } catch (err) {
          // 共有シートを閉じただけの場合は何もしない
        }
      } else {
        alert("この端末では共有できません。画像を長押しして保存してください。");
      }
    });

    document.getElementById("delete").addEventListener("click", async () => {
      if (!currentPhoto) return;
      if (!confirm("この写真を削除しますか？")) return;
      await deletePhoto(currentPhoto.id);
      currentPhoto.thumb.remove();
      if (photos.querySelectorAll("img").length === 0) empty.style.display = "";
      closeDetail();
    });

    /* ========== 起動時の処理 ========== */

    async function init() {
      // 保存済みの写真を読み込んで並べる（古い順に追加 → 新しいものが先頭に来る）
      try {
        const saved = await loadPhotos();
        saved.forEach(addThumbnail);
      } catch (err) {
        console.error(err);
      }
      // データが勝手に消されにくくなるようにお願いする
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist();
      }
      startCamera();
    }

    init();
  </script>
</body>
</html>
