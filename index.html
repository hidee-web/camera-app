<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カメラアプリ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="apple-mobile-web-app-title" content="カメラ">
    <meta name="theme-color" content="#2563eb">
</head>
<body>
    <h1>カメラアプリ</h1>
    <input type="file" accept="image/*" capture="environment" id="camera">
    <img id="preview" style="max-width:100%; margin-top:16px;">
    <script>
        document.getElementById('camera').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                    document.getElementById('preview').src = URL.createObjectURL(file);
                };
            });
    </script>
</body>
</html>
